; Previous target: Waveshare ESP32-S3-Touch-AMOLED-2.16 (see git history)
[env:ideaspark_114_st7789]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200

; No OTA in this project. min_spiffs.csv (used previously) still wasted a
; ~1.9 MB second OTA app slot nobody uses; partitions_app.csv (in this repo)
; drops OTA for one big "factory" app partition instead — needed headroom
; once WiFi + WebServer + the web UI joined LVGL. nvs stays at 0x9000 (same
; offset/size as min_spiffs.csv) so the sensor_hist/usage_hist/wifi NVS
; blobs survive the switch. See partitions_app.csv's own comment for the
; full layout.
board_build.partitions = partitions_app.csv

build_flags =
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    ; LVGL's builtin allocator (the default) reserves a FIXED static pool
    ; (LV_MEM_SIZE, default 64 KB) carved out of DRAM up front, used for
    ; every widget/style AND every transient allocation a redraw needs. Once
    ; WiFi/lwIP's own static footprint (~15 KB, unavoidable) joined the
    ; build, no fixed pool size threaded the needle: too big overflows the
    ; DRAM link budget, too small leaves this project's ~150-250 widgets so
    ; little redraw headroom (measured: 96% used, 492-byte biggest free
    ; block at 55 KB) that lv_timer_handler() hangs redrawing a multi-widget
    ; screen for the first time. Switching to the C library allocator (CLIB)
    ; removes the fixed pool entirely — LVGL draws from the same general
    ; heap as everything else (~70+ KB free at runtime) instead of a
    ; separate cramped reservation. See CLAUDE.md for the full story.
    -DLV_USE_STDLIB_MALLOC=1
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.6
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
